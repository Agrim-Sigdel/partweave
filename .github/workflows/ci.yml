name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CLI: "partweave"

jobs:
  generator:
    name: generator and catalog contract
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter partweave typecheck
      - run: pnpm --filter partweave test
      - run: pnpm --filter partweave build
      - id: catalog
        name: Discover selectable module checks
        run: node packages/cli/scripts/check-catalog.mjs --matrix | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"

  catalog:
    name: "generated: ${{ matrix.id }}"
    needs: generator
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generator.outputs.matrix) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter partweave build
      - name: Install, typecheck, test, migrate and build generated apps
        env:
          PARTWEAVE_TEST_DATABASE_URL: postgres://app:app@localhost:5432/app
        run: node packages/cli/scripts/check-catalog.mjs --case "${{ matrix.id }}" --dir "$RUNNER_TEMP/catalog"

  docker:
    name: docker build (server image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Build the generator
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "$CLI" build
      - name: Scaffold server with docker
        run: node packages/cli/dist/index.js create app --dir "$RUNNER_TEMP/app" --server --no-web --no-mobile --with docker --yes
      # The generated Dockerfile uses `COPY . .`, so the build context is apps/server.
      - name: Build the server image
        working-directory: ${{ runner.temp }}/app
        run: docker build -t partweave-server-ci apps/server
