version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/modules/_core/web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/modules/_core/mobile"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/packages/api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/modules/_core/server"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
